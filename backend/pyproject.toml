[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rentroo"
version = "0.1.0"
description = "Commute and last-mile analysis engine for rental research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
seed = ["osmium>=3.7", "rich>=13.7"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "fakeredis>=2.23"]

[tool.hatch.build.targets.wheel]
packages = ["rentroo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
